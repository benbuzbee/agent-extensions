version: 1
direction: right
lanes: [src, mid, dst]
nodes:
  src:
    label: Source
    children: [a, b]
  mid:
    label: Middle
    children: [m]
  dst:
    label: Destination
    children: [x, y]
  a: { label: A }
  b: { label: B }
  m: { label: M }
  x: { label: X }
  y: { label: Y }
edges:
  - { from: a, to: m }
  - { from: b, to: m }
  - { from: m, to: x }
  - { from: m, to: y }
