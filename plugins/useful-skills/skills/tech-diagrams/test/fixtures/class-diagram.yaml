version: 1
direction: down
nodes:
  animal:
    label: Animal
  dog:
    label: Dog
  car:
    label: Car
  engine:
    label: Engine
  team:
    label: Team
  player:
    label: Player
  service:
    label: Service
  logger:
    label: Logger
  mediator:
    label: Mediator
  worker:
    label: Worker
  noteSrc:
    label: Note
  noteDst:
    label: Anchor
edges:
  # inheritance: dog → animal, end triangle outline
  - from: dog
    to: animal
    label: extends
    style: { endArrow: triangle_outline }
  # composition: car owns engine, start filled diamond
  - from: car
    to: engine
    label: composes
    style: { startArrow: diamond, endArrow: arrow }
  # aggregation: team aggregates player, start open diamond
  - from: team
    to: player
    label: has
    style: { startArrow: diamond_outline, endArrow: arrow }
  # dependency: service uses logger, dashed end arrow
  - from: service
    to: logger
    label: uses
    style: { endArrow: arrow, strokeStyle: dashed }
  # double-ended: bidirectional association
  - from: mediator
    to: worker
    label: talks
    style: { startArrow: arrow, endArrow: arrow }
  # explicit "none" maps to null on the wire
  - from: noteSrc
    to: noteDst
    style: { endArrow: none }
