version: 1
direction: right
nodes:
  start:
    label: Start
    shape: ellipse
    style:
      fill: green-light
      fillStyle: solid
  pending:
    label: Pending
    style:
      fill: yellow-light
  running:
    label: Running
    style:
      fill: blue-light
      fillStyle: cross-hatch
  success:
    label: Success
    shape: ellipse
    style:
      fill: green-light
      stroke: green
      strokeWidth: 3
  failed:
    label: Failed
    shape: ellipse
    style:
      fill: red-light
      stroke: red
      strokeWidth: 3
  retry:
    label: Retry
    shape: diamond
    style:
      fill: orange-light
edges:
  - from: start
    to: pending
  - from: pending
    to: running
    label: dequeue
  - from: running
    to: success
    label: ok
    style:
      stroke: green
  - from: running
    to: failed
    label: error
    style:
      stroke: red
      strokeStyle: dashed
  - from: failed
    to: retry
  - from: retry
    to: pending
    label: requeue
    style:
      strokeStyle: dotted
