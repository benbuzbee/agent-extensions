version: 1
direction: right
nodes:
  user:
    label: User
    shape: ellipse
  validator:
    label: Validate
    shape: diamond
    style:
      fill: yellow-light
  store:
    label: Store
    style:
      fill: green-light
      fillStyle: solid
  reject:
    label: Reject
    style:
      fill: red-light
edges:
  - from: user
    to: validator
  - from: validator
    to: store
    label: ok
    style:
      stroke: green
  - from: validator
    to: reject
    label: fail
    style:
      stroke: red
      strokeStyle: dashed
