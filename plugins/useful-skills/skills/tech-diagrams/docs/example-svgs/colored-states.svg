<text x="544" y="34" font-size="16" fill="#1e1e1e" class="tg-text-black tg-halo-stroke" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" dominant-baseline="central">error</text>
<text x="544" y="115.5" font-size="16" fill="#1e1e1e" class="tg-text-black tg-halo-stroke" stroke="white" stroke-width="4" stroke-linejoin="round" paint-order="stroke" text-anchor="middle" dominant-baseline="central">requeue</text>
