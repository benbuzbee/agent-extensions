<svg xmlns="http://www.w3.org/2000/svg" class="tg-svg" viewBox="8 8 1513.6 234.5" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
<style>
  .tg-svg {
    color-scheme: light dark;
    --tg-stroke-black: #1e1e1e;
    --tg-stroke-gray: #5c5f66;
    --tg-stroke-red: #e03131;
    --tg-stroke-orange: #f08c00;
    --tg-stroke-yellow: #f59f00;
    --tg-stroke-green: #2f9e44;
    --tg-stroke-teal: #0c8599;
    --tg-stroke-blue: #1971c2;
    --tg-stroke-violet: #6741d9;
    --tg-stroke-pink: #c2255c;
    --tg-halo: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    .tg-svg {
      --tg-stroke-black: #e6e6e6;
      --tg-stroke-gray: #9aa0a6;
      --tg-stroke-red: #ff8585;
      --tg-stroke-orange: #ffb066;
      --tg-stroke-yellow: #ffd966;
      --tg-stroke-green: #7fd28f;
      --tg-stroke-teal: #6dd5e6;
      --tg-stroke-blue: #7fb1ff;
      --tg-stroke-violet: #bda3ff;
      --tg-stroke-pink: #ff8fb6;
      --tg-halo: #0f1115;
    }
  }
  .tg-svg .tg-stroke-black { stroke: var(--tg-stroke-black); }
  .tg-svg .tg-stroke-gray { stroke: var(--tg-stroke-gray); }
  .tg-svg .tg-stroke-red { stroke: var(--tg-stroke-red); }
  .tg-svg .tg-stroke-orange { stroke: var(--tg-stroke-orange); }
  .tg-svg .tg-stroke-yellow { stroke: var(--tg-stroke-yellow); }
  .tg-svg .tg-stroke-green { stroke: var(--tg-stroke-green); }
  .tg-svg .tg-stroke-teal { stroke: var(--tg-stroke-teal); }
  .tg-svg .tg-stroke-blue { stroke: var(--tg-stroke-blue); }
  .tg-svg .tg-stroke-violet { stroke: var(--tg-stroke-violet); }
  .tg-svg .tg-stroke-pink { stroke: var(--tg-stroke-pink); }
  .tg-svg .tg-text-black { fill: var(--tg-stroke-black); }
  .tg-svg .tg-text-gray { fill: var(--tg-stroke-gray); }
  .tg-svg .tg-text-red { fill: var(--tg-stroke-red); }
  .tg-svg .tg-text-orange { fill: var(--tg-stroke-orange); }
  .tg-svg .tg-text-yellow { fill: var(--tg-stroke-yellow); }
  .tg-svg .tg-text-green { fill: var(--tg-stroke-green); }
  .tg-svg .tg-text-teal { fill: var(--tg-stroke-teal); }
  .tg-svg .tg-text-blue { fill: var(--tg-stroke-blue); }
  .tg-svg .tg-text-violet { fill: var(--tg-stroke-violet); }
  .tg-svg .tg-text-pink { fill: var(--tg-stroke-pink); }
  .tg-svg .tg-fill-gray-light { fill: color-mix(in srgb, var(--tg-stroke-gray) 18%, transparent); }
  .tg-svg .tg-fill-red-light { fill: color-mix(in srgb, var(--tg-stroke-red) 18%, transparent); }
  .tg-svg .tg-fill-orange-light { fill: color-mix(in srgb, var(--tg-stroke-orange) 18%, transparent); }
  .tg-svg .tg-fill-yellow-light { fill: color-mix(in srgb, var(--tg-stroke-yellow) 18%, transparent); }
  .tg-svg .tg-fill-green-light { fill: color-mix(in srgb, var(--tg-stroke-green) 18%, transparent); }
  .tg-svg .tg-fill-teal-light { fill: color-mix(in srgb, var(--tg-stroke-teal) 18%, transparent); }
  .tg-svg .tg-fill-blue-light { fill: color-mix(in srgb, var(--tg-stroke-blue) 18%, transparent); }
  .tg-svg .tg-fill-violet-light { fill: color-mix(in srgb, var(--tg-stroke-violet) 18%, transparent); }
  .tg-svg .tg-fill-pink-light { fill: color-mix(in srgb, var(--tg-stroke-pink) 18%, transparent); }
  .tg-svg .tg-fill-transparent { fill: transparent; }
  .tg-svg .tg-fill-none { fill: none; }
  .tg-svg .tg-halo-stroke { stroke: var(--tg-halo); }
  .tg-svg .tg-halo-fill { fill: var(--tg-halo); }
</style>
<defs><marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
