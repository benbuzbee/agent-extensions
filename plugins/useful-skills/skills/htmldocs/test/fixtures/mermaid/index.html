<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: mermaid</title>
<style>
  body { font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  article { margin: 1.5rem 0; }
  pre.mermaid { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; white-space: pre-wrap; margin: 0; }
  figure { margin: 1rem 0; }
</style>
</head>
<body>
<h1>Mermaid fixture</h1>
<article id="diagrams">
  <h2>Two diagrams, one script</h2>

  <figure id="flow" data-kind="diagram">
    <pre class="mermaid">flowchart LR
  A[Author DSL] --> B[Open doc]
  B --> C[Render SVG]</pre>
    <figcaption>Flowchart: DSL renders to SVG on open.</figcaption>
  </figure>

  <!-- Sequence diagram exercises the escaping rule: &gt;&gt; is the literal
       text of a ->> message arrow, written escaped per htmldocs's pre rule.
       The browser decodes it back to ->> before Mermaid parses. -->
  <figure id="seq" data-kind="diagram">
    <pre class="mermaid">sequenceDiagram
  participant W as Worker
  participant DB as Postgres
  W-&gt;&gt;DB: write row
  DB--&gt;&gt;W: ack</pre>
    <figcaption>Sequence: worker writes before the ack.</figcaption>
  </figure>
</article>

<!-- One Mermaid script renders every pre.mermaid on the page — the proven
     one-time snippet, verbatim per references/mermaid.md. -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default' });
  await mermaid.run();
</script>
<noscript>
  <p>Diagrams on this page render with JavaScript — enable it to see the visuals. Otherwise each diagram is shown above as its Mermaid source.</p>
</noscript>
</body>
</html>
